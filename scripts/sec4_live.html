<style>

/* =========================
   MAIN SECTION
========================= */

  text-align: center;

/* =========================

  overflow: hidden;
  position: relative;
  padding-left: 24px;

.veloraa-slider {
  display: flex;

  align-items: center;
  justify-content: center;

  padding: 20px;

  box-sizing: border-box;

<script>

document.addEventListener("DOMContentLoaded", function () {

  const slider = document.getElementById("veloraaSlider");

  const popup = document.getElementById("veloraaVideoPopup");

  const popupVideo = document.getElementById("veloraaPopupVideo");

  const popupClose = document.getElementById("veloraaPopupClose");

  const popupOverlay = popup.querySelector(".veloraa-popup-overlay");


  if (!slider) return;


  /* =========================
     DUPLICATE CARDS
  ========================= */

  const originalCards = Array.from(slider.children);

  originalCards.forEach(card => {
    slider.appendChild(card.cloneNode(true));
  });


  /* =========================
     AUTO SCROLL
  ========================= */

  let position = 0;

  const speed = 0.45;

  let isDragging = false;

  let startX = 0;

  let startPosition = 0;


  function animate() {

    if (!isDragging && !popup.classList.contains("active")) {

      position += speed;

      const loopWidth = slider.scrollWidth / 2;

      if (position >= loopWidth) {
        position = 0;
      }

      slider.style.transform =
        `translate3d(${-position}px, 0, 0)`;

    }

    requestAnimationFrame(animate);

  }

  requestAnimationFrame(animate);


  /* =========================
     MOUSE DRAG
  ========================= */

  slider.addEventListener("mousedown", function (e) {

    isDragging = true;

    startX = e.clientX;

    startPosition = position;

    slider.style.cursor = "grabbing";

  });


  document.addEventListener("mousemove", function (e) {

    if (!isDragging) return;

    const difference = startX - e.clientX;

    position = startPosition + difference;

    const loopWidth = slider.scrollWidth / 2;

    if (position < 0) {
      position += loopWidth;

      startPosition = position;

      startX = e.clientX;
    }

    if (position >= loopWidth) {
      position -= loopWidth;

      startPosition = position;

      startX = e.clientX;
    }

    slider.style.transform =
      `translate3d(${-position}px, 0, 0)`;

  });


  document.addEventListener("mouseup", function () {

    if (!isDragging) return;

    isDragging = false;

    slider.style.cursor = "grab";

  });


  /* =========================
     MOBILE SWIPE
  ========================= */

  slider.addEventListener("touchstart", function (e) {

    isDragging = true;

    startX = e.touches[0].clientX;

    startPosition = position;

  }, { passive: true });


  slider.addEventListener("touchmove", function (e) {

    if (!isDragging) return;

    const currentX = e.touches[0].clientX;

    const difference = startX - currentX;

    position = startPosition + difference;

    const loopWidth = slider.scrollWidth / 2;

    if (position < 0) {

      position += loopWidth;

      startPosition = position;

      startX = currentX;

    }

    if (position >= loopWidth) {

      position -= loopWidth;

      startPosition = position;

      startX = currentX;

    }

    slider.style.transform =
      `translate3d(${-position}px, 0, 0)`;

  }, { passive: true });


  slider.addEventListener("touchend", function () {

    isDragging = false;

  }, { passive: true });


  /* =========================
     AUTOPLAY CARD VIDEOS
  ========================= */

  const videos =
    document.querySelectorAll(".veloraa-card video");


  videos.forEach(video => {

    video.muted = true;

    video.autoplay = true;

    video.loop = true;

    video.playsInline = true;

    video.controls = false;

    video.setAttribute("muted", "");

    video.setAttribute("autoplay", "");

    video.setAttribute("playsinline", "");

    video.setAttribute("loop", "");

    video.play().catch(() => {});

  });


  /* =========================
     PLAY ONLY VISIBLE VIDEOS
  ========================= */

  const observer =
    new IntersectionObserver(entries => {

      entries.forEach(entry => {

        const video = entry.target;

        if (
          entry.isIntersecting &&
          !popup.classList.contains("active")
        ) {

          video.muted = true;

          video.play().catch(() => {});

        } else {

          video.pause();

        }

      });

    }, {
      threshold: 0.1
    });


  videos.forEach(video => {

    observer.observe(video);

  });


  /* =========================
     OPEN VIDEO POPUP
  ========================= */

  let dragDistance = 0;


  slider.addEventListener("click", function (e) {

    const card = e.target.closest(".veloraa-card");

    if (!card) return;


    const video = card.querySelector("video");

    if (!video) return;


    /* Get video source */

    const source =
      video.querySelector("source");

    if (!source) return;


    const videoURL = source.src;


    /* Stop dragging */

    if (Math.abs(dragDistance) > 10) {

      dragDistance = 0;

      return;

    }


    /* Pause carousel */

    isDragging = false;


    /* Pause all card videos */

    videos.forEach(v => {

      v.pause();

    });


    /* Load selected video into popup */

    popupVideo.src = videoURL;

    popupVideo.muted = false;

    popupVideo.controls = true;

    popupVideo.currentTime = 0;


    /* Show popup */

    popup.classList.add("active");


    /* Prevent background scrolling */

    document.body.style.overflow = "hidden";


    /* Play with sound */

    popupVideo.play().catch(() => {});

  });


  /* =========================
     CLOSE POPUP
  ========================= */

  function closePopup() {

    popupVideo.pause();

    popupVideo.removeAttribute("src");

    popupVideo.load();

    popup.classList.remove("active");

    document.body.style.overflow = "";


    /* Restart visible videos */

    videos.forEach(video => {

      if (video.getBoundingClientRect().right > 0 &&
          video.getBoundingClientRect().left < window.innerWidth) {

        video.muted = true;

        video.play().catch(() => {});

      }

    });

  }


  popupClose.addEventListener("click", closePopup);

  popupOverlay.addEventListener("click", closePopup);


  /* ESC KEY */

  document.addEventListener("keydown", function (e) {

    if (e.key === "Escape" &&
        popup.classList.contains("active")) {

      closePopup();

    }

  });


});

</script>
