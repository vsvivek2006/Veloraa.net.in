<script>

(function () {

  function initVeloraaReviews() {

    const slider =
      document.getElementById("veloraaReviewsSlider");

    if (!slider) return;

    /* Prevent duplicate initialization */
    if (slider.dataset.initialized === "true") return;

    slider.dataset.initialized = "true";


    /* =====================================
       SAVE ORIGINAL REVIEWS
    ====================================== */

    const originalCards =
      Array.from(slider.children);


    /* =====================================
       DUPLICATE FOR INFINITE SCROLL
    ====================================== */

    originalCards.forEach(function (card) {

      slider.appendChild(
        card.cloneNode(true)
      );

    });


    /* =====================================
       VARIABLES
    ====================================== */

    let position = 0;

    let speed = 0.5;

    let autoScroll = true;

    let dragging = false;

    let startX = 0;

    let startPosition = 0;


    /* =====================================
       LOOP WIDTH
    ====================================== */

    function getLoopWidth() {

      return slider.scrollWidth / 2;

    }


    /* =====================================
       UPDATE POSITION
    ====================================== */

    function updatePosition() {

      slider.style.transform =
        "translate3d(" +
        (-position) +
        "px, 0, 0)";

    }


    /* =====================================
       AUTO SCROLL
    ====================================== */

    function animate() {

      if (autoScroll && !dragging) {

        position += speed;

        const loopWidth =
          getLoopWidth();

        if (position >= loopWidth) {

          position -= loopWidth;

        }

        updatePosition();

      }

      requestAnimationFrame(animate);

    }


    /* START AUTO SCROLL */
    requestAnimationFrame(animate);


    /* =====================================
       DESKTOP HOVER
    ====================================== */

    slider.addEventListener(
      "mouseenter",
      function () {

        autoScroll = false;

      }
    );


    slider.addEventListener(
      "mouseleave",
      function () {

        if (!dragging) {

          autoScroll = true;

        }

      }
    );


    /* =====================================
       TOUCH START
    ====================================== */

    slider.addEventListener(
      "touchstart",
      function (e) {

        dragging = true;

        autoScroll = false;

        startX =
          e.touches[0].clientX;

        startPosition =
          position;

      },
      { passive: true }
    );


    /* =====================================
       TOUCH MOVE
    ====================================== */

    slider.addEventListener(
      "touchmove",
      function (e) {

        if (!dragging) return;

        const currentX =
          e.touches[0].clientX;

        const difference =
          startX - currentX;

        position =
          startPosition + difference;

        const loopWidth =
          getLoopWidth();


        if (position < 0) {

          position += loopWidth;

          startPosition = position;

          startX = currentX;

        }


        if (position >= loopWidth) {

          position -= loopWidth;

          startPosition = position;

          startX = currentX;

        }


        updatePosition();

      },
      { passive: true }
    );


    /* =====================================
       TOUCH END
    ====================================== */

    slider.addEventListener(
      "touchend",
      function () {

        dragging = false;

        setTimeout(
          function () {

            autoScroll = true;

          },
          700
        );

      },
      { passive: true }
    );


    /* =====================================
       MOUSE DRAG
    ====================================== */

    slider.addEventListener(
      "mousedown",
      function (e) {

        dragging = true;

        autoScroll = false;

        startX = e.clientX;

        startPosition = position;

        slider.style.cursor =
          "grabbing";

      }
    );


    document.addEventListener(
      "mousemove",
      function (e) {

        if (!dragging) return;

        const difference =
          startX - e.clientX;

        position =
          startPosition + difference;

        const loopWidth =
          getLoopWidth();


        if (position < 0) {

          position += loopWidth;

          startPosition = position;

          startX = e.clientX;

        }


        if (position >= loopWidth) {

          position -= loopWidth;

          startPosition = position;

          startX = e.clientX;

        }


        updatePosition();

      }
    );


    document.addEventListener(
      "mouseup",
      function () {

        if (!dragging) return;

        dragging = false;

        slider.style.cursor =
          "grab";


        setTimeout(
          function () {

            autoScroll = true;

          },
          700
        );

      }
    );

  }


  /* =====================================
     INITIALIZE
  ====================================== */

  if (
    document.readyState ===
    "loading"
  ) {

    document.addEventListener(
      "DOMContentLoaded",
      initVeloraaReviews
    );

  } else {

    initVeloraaReviews();

  }


  /* Shopify Theme Editor support */

  document.addEventListener(
    "shopify:section:load",
    function () {

      setTimeout(
        initVeloraaReviews,
        100
      );

    }
  );


  /* Extra fallback for Custom Liquid */

  setTimeout(
    initVeloraaReviews,
    500
  );

})();
</script>
